[project]
name = "survey-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "celery[redis]>=5.6.3",
    "emails>=1.1.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "flower>=2.0.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
